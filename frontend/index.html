<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitParty</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <div class="logo">GitParty</div>
    <button onclick="mostrarPagina('home')">Home</button>
    <button onclick="mostrarPagina('eventos')">Eventos</button>
    <button onclick="mostrarPagina('usuarios')">Usuários</button>
    <button onclick="mostrarPagina('inscricoes')">Inscrições</button>
  </nav>

  <div id="home" class="pagina">
    <div class="hero">
      <h1><span>GitParty</span></h1>
      <p>Gerencie eventos, usuários e inscrições.</p>
      <button onclick="mostrarPagina('eventos')">Ver Eventos</button>
      <button onclick="abrirModalEvento(null)">Criar Evento</button>
    </div>
    <h2>Resumo</h2>
    <div id="resumo"></div>
    <h2>Eventos Recentes</h2>
    <div id="home-eventos"></div>
  </div>

  <div id="eventos" class="pagina" style="display:none">
    <div class="topo">
      <h1>Eventos</h1>
      <button onclick="abrirModalEvento(null)">+ Novo Evento</button>
    </div>
    <input type="text" id="busca-evento" placeholder="Buscar evento..." oninput="renderEventos()">
    <div id="lista-eventos"></div>
  </div>

  <div id="usuarios" class="pagina" style="display:none">
    <div class="topo">
      <h1>Usuários</h1>
      <button onclick="abrirModalUsuario(null)">+ Novo Usuário</button>
    </div>
    <input type="text" id="busca-usuario" placeholder="Buscar usuário..." oninput="renderUsuarios()">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Telefone</th>
         
        </tr>
      </thead>
      <tbody id="tbody-usuarios"></tbody>
    </table>
  </div>

  <div id="inscricoes" class="pagina" style="display:none">
    <div class="topo">
      <h1>Inscrições</h1>
      <button onclick="abrirModalInscricao(null)">+ Nova Inscrição</button>
    </div>
    <input type="text" id="busca-inscricao" placeholder="Buscar inscrição..." oninput="renderInscricoes()">
    <table>
      <thead>
        <tr>
          <th>Usuário</th>
          <th>Evento</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tbody-inscricoes"></tbody>
    </table>
  </div>

  <div id="modal-evento" class="modal-fundo" style="display:none">
    <div class="modal-caixa">
      <h2 id="modal-evento-titulo">Novo Evento</h2>

      <label>Nome *</label>
      <input type="text" id="ev-nome" placeholder="Nome do evento">

      <label>Descrição</label>
      <textarea id="ev-desc" placeholder="Descrição..."></textarea>

      <label>Data *</label>
      <input type="date" id="ev-data">

      <label>Local</label>
      <input type="text" id="ev-local" placeholder="Ex: São Paulo">

      <label>Capacidade *</label>
      <input type="number" id="ev-capacidade" placeholder="Ex: 100">

      <label>Categoria</label>
      <select id="ev-categoria">
        <option>Tecnologia</option>
        <option>Negócios</option>
        <option>Arte</option>
        <option>Esporte</option>
        <option>Música</option>
        <option>Outro</option>
      </select>

      <label>URL da Imagem</label>
      <input type="text" id="ev-imagem" placeholder="URL da imagem">

      <div class="modal-botoes">
        <button id="btn-excluir-evento" onclick="excluirEvento()" class="btn-excluir" style="display:none">Excluir</button>
        <button onclick="fecharModalEvento()" class="btn-cancelar">Cancelar</button>
        <button onclick="salvarEvento()">Salvar</button>
      </div>
    </div>
  </div>

  <div id="modal-usuario" class="modal-fundo" style="display:none">
    <div class="modal-caixa">
      <h2 id="modal-usuario-titulo">Novo Usuário</h2>

      <label>Nome *</label>
      <input type="text" id="us-nome" placeholder="Nome completo">

      <label>Email *</label>
      <input type="email" id="us-email" placeholder="email@exemplo.com">

      <label>Telefone</label>
      <input type="text" id="us-telefone" placeholder="(11) 99999-9999">

      <div class="modal-botoes">
        <button id="btn-excluir-usuario" onclick="excluirUsuario()" class="btn-excluir" style="display:none">Excluir</button>
        <button onclick="fecharModalUsuario()" class="btn-cancelar">Cancelar</button>
        <button onclick="salvarUsuario()">Salvar</button>
      </div>
    </div>
  </div>

  <div id="modal-inscricao" class="modal-fundo" style="display:none">
    <div class="modal-caixa">
      <h2 id="modal-inscricao-titulo">Nova Inscrição</h2>

      <label>Usuário *</label>
      <select id="ins-usuario"></select>

      <label>Evento *</label>
      <select id="ins-evento"></select>

      <label>Status</label>
      <select id="ins-status">
        <option value="confirmado">Confirmado</option>
        <option value="pendente">Pendente</option>
        <option value="cancelado">Cancelado</option>
      </select>

      <label>Observações</label>
      <textarea id="ins-obs" placeholder="Opcional..."></textarea>

      <p id="ins-aviso" style="color:#f87171; margin-top:0.5rem"></p>

      <div class="modal-botoes">
        <button id="btn-excluir-inscricao" onclick="excluirInscricao()" class="btn-excluir" style="display:none">Excluir</button>
        <button onclick="fecharModalInscricao()" class="btn-cancelar">Cancelar</button>
        <button onclick="salvarInscricao()">Salvar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
